<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta KoboToolbox</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #218838;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        #mensaje {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .exito {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Encuesta de Registro</h2>
        <form id="koboForm">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" required placeholder="Tu apellido">
            </div>

            <div class="form-group">
                <label for="sexo">Sexo:</label>
                <select id="sexo" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="si_por_favor">Si por favor</option>
                </select>
            </div>

            <button type="submit" id="btnEnviar">Enviar Datos</button>
        </form>

        <div id="mensaje"></div>
    </div>

    <script>
        const KOBO_UID  = 'aqzB9riFJ2PJrtN8iijwaS';
        const targetUrl = `https://kf.kobotoolbox.org/api/v2/assets/${KOBO_UID}/submissions/`;
        const koboUrl   = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

        const form = document.getElementById('koboForm');
        const mensajeDiv = document.getElementById('mensaje');
        const btnEnviar = document.getElementById('btnEnviar');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            btnEnviar.disabled = true;
            btnEnviar.innerText = 'Enviando...';
            mensajeDiv.style.display = 'none';

            // Nombre de variables en MAYÚSCULAS según la configuración de tu columna XML en Kobo
            const payload = {
                submission: {
                    "NOMBRE": document.getElementById('nombre').value,
                    "APELLIDO": document.getElementById('apellido').value,
                    "SEXO": document.getElementById('sexo').value
                }
            };

            fetch(koboUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok || response.status === 201) {
                    mostrarMensaje('¡Datos registrados con éxito!', 'exito');
                    form.reset();
                } else {
                    mostrarMensaje('Error al enviar los datos. Código: ' + response.status, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                mostrarMensaje('Error de red al conectar con Kobo.', 'error');
            })
            .finally(() => {
                btnEnviar.disabled = false;
                btnEnviar.innerText = 'Enviar Datos';
            });
        });

        function mostrarMensaje(texto, tipo) {
            mensajeDiv.innerText = texto;
            mensajeDiv.className = tipo;
            mensajeDiv.style.display = 'block';
        }
    </script>
</body>
</html>
