<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Registro</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            color: #f8fafc;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
        }
        h2 { 
            margin-top: 0; 
            color: #ffffff; 
            text-align: center;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 500; 
            color: #94a3b8;
            font-size: 14px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 15px;
            color: #f8fafc;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        select option { background: #1e293b; color: #f8fafc; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            transform: translateY(-1px);
        }
        button:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
        }
        #mensaje {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        .exito { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Encuesta de Registro</h2>
        <form id="koboForm">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required placeholder="Escribe tu nombre">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" required placeholder="Escribe tu apellido">
            </div>

            <div class="form-group">
                <label for="sexo">Sexo</label>
                <select id="sexo" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <button type="submit" id="btnEnviar">Enviar Datos</button>
        </form>

        <div id="mensaje"></div>
    </div>

    <script>
        // ============================================================
        // PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
        // ============================================================
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwWu1TVNBWyIZIKG1IXvymyqeeGwiJYaoAGHy5h5HVBM2scXZXko26WpY33L0TCqBUQ/exec';

        const form = document.getElementById('koboForm');
        const mensajeDiv = document.getElementById('mensaje');
        const btnEnviar = document.getElementById('btnEnviar');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const apellido = document.getElementById('apellido').value.trim();
            const sexo = document.getElementById('sexo').value;

            if (!nombre || !apellido || !sexo) {
                mostrarMensaje('Por favor, completa todos los campos.', 'error');
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.innerText = 'Enviando...';
            mensajeDiv.style.display = 'none';

            // Estructura que espera KoboToolbox
            const payload = {
                "NOMBRE": nombre,
                "APELLIDO": apellido,
                "SEXO": sexo
            };

            // ¡CAMBIO IMPORTANTE AQUÍ!
            // Usamos 'text/plain' para evitar el error de CORS (preflight)
            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    mostrarMensaje('¡Datos registrados con éxito!', 'exito');
                    form.reset();
                } else {
                    mostrarMensaje('Error del servidor: ' + (data.message || 'Desconocido'), 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor.', 'error');
            })
            .finally(() => {
                btnEnviar.disabled = false;
                btnEnviar.innerText = 'Enviar Datos';
            });
        });

        function mostrarMensaje(texto, tipo) {
            mensajeDiv.innerText = texto;
            mensajeDiv.className = tipo;
            mensajeDiv.style.display = 'block';
        }
    </script>
</body>
</html>
